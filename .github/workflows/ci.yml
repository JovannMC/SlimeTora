name: CI

on:
    push:
        branches: [main]
        paths:
            - "src/**"
            - "scripts/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "electron-builder.yml"
            - ".github/workflows/**"
    pull_request:
        paths:
            - "src/**"
            - "scripts/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "electron-builder.yml"
            - ".github/workflows/**"
    workflow_dispatch:

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm run typecheck

            - name: Lint
              run: pnpm run lint

            - name: Format check
              run: pnpm run format:check

            - name: Package
              run: pnpm run dist

            - name: Upload Linux (DEB)
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v7
              with:
                  path: release/*.deb
                  archive: false
                  if-no-files-found: error

            - name: Upload Linux (AppImage)
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v7
              with:
                  path: release/*.AppImage
                  archive: false
                  if-no-files-found: error

            - name: Upload Windows (installer)
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@v7
              with:
                  path: release/*.exe
                  archive: false
                  if-no-files-found: error

            - name: Upload macOS (Disk Image)
              if: runner.os == 'macOS'
              uses: actions/upload-artifact@v7
              with:
                  path: release/*.dmg
                  archive: false
                  if-no-files-found: error

            - name: Upload macOS (ZIP)
              if: runner.os == 'macOS'
              uses: actions/upload-artifact@v7
              with:
                  path: release/*-mac.zip
                  archive: false
                  if-no-files-found: error
