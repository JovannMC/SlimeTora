name: CI

on:
    push:
        branches: [main]
        paths: [src/**]
    pull_request:
        paths: [src/**]
    workflow_dispatch:

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm ci

            - name: Typecheck
              run: pnpm run typecheck

            - name: Lint
              run: pnpm run lint

            - name: Format check
              run: pnpm run format:check

            - name: Build
              run: pnpm run build
