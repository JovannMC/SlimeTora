name: CI

on:
    push:
        branches: [main]
        tags:
            - "v*"
        paths:
            - "src/**"
            - "updates/**"
            - "scripts/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "electron-builder.yml"
            - ".github/workflows/**"
    pull_request:
        paths:
            - "src/**"
            - "updates/**"
            - "scripts/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "electron-builder.yml"
            - ".github/workflows/**"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux x64
                      runner: ubuntu-24.04
                      arch: x64
                    - name: Linux ARM64
                      runner: ubuntu-24.04-arm
                      arch: arm64
                    - name: Windows x64
                      runner: windows-2025
                      arch: x64
                    - name: Windows ARM64
                      runner: windows-11-arm
                      arch: arm64
                    - name: macOS Intel
                      runner: macos-15-intel
                      arch: x64
                    - name: macOS Apple Silicon
                      runner: macos-15
                      arch: arm64
        name: Verify (${{ matrix.name }})
        runs-on: ${{ matrix.runner }}

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm run typecheck

            - name: Lint
              run: pnpm run lint

            - name: Format check
              run: pnpm run format:check

            - name: Package
              run: pnpm run build && pnpm exec electron-builder --publish never --${{ matrix.arch }}

            - name: Upload Linux (DEB)
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v7
              with:
                  path: release/*.deb
                  archive: false
                  if-no-files-found: error

            - name: Upload Linux (AppImage)
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v7
              with:
                  path: release/*.AppImage
                  archive: false
                  if-no-files-found: error

            - name: Upload Windows (installer)
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@v7
              with:
                  path: release/*.exe
                  archive: false
                  if-no-files-found: error

            - name: Upload macOS (Disk Image)
              if: runner.os == 'macOS'
              uses: actions/upload-artifact@v7
              with:
                  path: release/*.dmg
                  archive: false
                  if-no-files-found: error

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: verify
        runs-on: ubuntu-24.04
        permissions:
            contents: write

        steps:
            - name: Download packaged artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: "*"
                  merge-multiple: true
                  path: release-assets

            - name: Create draft release
              uses: softprops/action-gh-release@v3
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  tag_name: ${{ github.ref_name }}
                  draft: true
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  files: release-assets/*
                  fail_on_unmatched_files: true
