appId: me.jovann.slimetora
productName: SlimeTora
copyright: Copyright © JovannMC
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

directories:
    output: release
    buildResources: build

files:
    - dist/**/*
    - package.json

asar: true
npmRebuild: true

win:
    target:
        - nsis

mac:
    category: public.app-category.utilities
    target:
        - dmg

linux:
    category: Utility
    syncDesktopName: true
    target:
        - AppImage
        - deb

nsis:
    oneClick: false
    allowToChangeInstallationDirectory: true
