packages:
    - src/renderer

allowBuilds:
    esbuild: true
    "@serialport/bindings-cpp": true
    "@stoprocent/noble": true
    "@stoprocent/bluetooth-hci-socket": true
    usb: true
    usocket: true
    electron-winstaller: true

minimumReleaseAgeExclude:
    - haritorax-interpreter@4.2.1

overrides:
    # stupid dumb electron builder using usocker which is stupid old causing native compilation errors for noble
    "usocket@0.3.0>node-gyp": "13.1.0"

patchedDependencies:
    dbus-next@0.10.2: patches/dbus-next@0.10.2.patch
